<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="760" height="470" fill="#ffffff"/>
<text x="40" y="42" font-size="21" font-weight="700" fill="#2b2b2b">The SEA Tech Salon, by the numbers</text>
<text x="40" y="66" font-size="13" fill="#7a7a7a">A monthly women-in-tech dinner in Singapore — from 6 women in 2018 to 55 today.</text>
<text x="40" y="106" font-size="13" font-weight="600" fill="#2b2b2b">How it has grown</text>
<rect x="40" y="309" width="54" height="21" rx="4" fill="#2A9D8F" opacity="0.45"/>
<text x="67" y="301" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">6</text>
<text x="67" y="348" font-size="12" text-anchor="middle" fill="#7a7a7a">2018</text>
<rect x="163" y="225" width="54" height="105" rx="4" fill="#2A9D8F" opacity="0.72"/>
<text x="190" y="217" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">30</text>
<text x="190" y="348" font-size="12" text-anchor="middle" fill="#7a7a7a">2020</text>
<rect x="286" y="138" width="54" height="192" rx="4" fill="#2A9D8F" opacity="0.99"/>
<text x="313" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">55</text>
<text x="313" y="348" font-size="12" text-anchor="middle" fill="#7a7a7a">2026</text>
<text x="410" y="106" font-size="13" font-weight="600" fill="#2b2b2b">Who’s in the room today (55)</text>
<text x="410" y="135" font-size="12.5" fill="#2b2b2b">Investors</text>
<rect x="514" y="123" width="150" height="16" rx="4" fill="#2A9D8F"/>
<text x="672" y="136" font-size="12" font-weight="600" fill="#7a7a7a">20 · 36%</text>
<text x="410" y="171" font-size="12.5" fill="#2b2b2b">Operators</text>
<rect x="514" y="159" width="150" height="16" rx="4" fill="#E9C46A"/>
<text x="672" y="172" font-size="12" font-weight="600" fill="#7a7a7a">20 · 36%</text>
<text x="410" y="207" font-size="12.5" fill="#2b2b2b">Founders</text>
<rect x="514" y="195" width="75" height="16" rx="4" fill="#E07A5F"/>
<text x="597" y="208" font-size="12" font-weight="600" fill="#7a7a7a">10 · 18%</text>
<text x="410" y="243" font-size="12.5" fill="#2b2b2b">In government</text>
<rect x="514" y="231" width="15" height="16" rx="4" fill="#6D8EA0"/>
<text x="537" y="244" font-size="12" font-weight="600" fill="#7a7a7a">2 · 4%</text>
<text x="410" y="279" font-size="12.5" fill="#2b2b2b">Other</text>
<rect x="514" y="267" width="22" height="16" rx="4" fill="#C08497"/>
<text x="544" y="280" font-size="12" font-weight="600" fill="#7a7a7a">3 · 5%</text>
<line x1="40" y1="410" x2="720" y2="410" stroke="#ececec"/>
<text x="40" y="436" font-size="11.5" fill="#7a7a7a">Roles as of Sep 2026. Host excluded. Reflects members’ current work — several founders now invest, and vice versa.</text>
</svg>