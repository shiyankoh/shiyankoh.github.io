# Recommended reads — edit this file to add/remove items.
# Each shelf has a key (drives the icon + colour), a label, and a list of items.
# Each item: title, by (author/host), url (optional), note (one line).
intro: "The books, essays, and shows I keep pressing on founders. Seeded from a couple of old posts — I'll keep adding to it."

shelves:
  - key: books
    label: BOOKS
    items:
      - title: "Leadership Without Easy Answers"
        by: "Ronald Heifetz"
        url: "https://bookshop.org/p/books/leadership-without-easy-answers-ronald-a-heifetz/46d79460b84d58f2?ean=9780674518582"
        note: "The book that rewired how I think about leadership. Adaptive vs. technical problems."
      - title: "The Five Dysfunctions of a Team"
        by: "Patrick Lencioni"
        url: "https://bookshop.org/p/books/the-five-dysfunctions-of-a-team-a-leadership-fable-patrick-m-lencioni/2f7512634ba6d549?ean=9780787960759"
        note: "Reads like a novel. Trust → conflict → commitment → accountability → results."
      - title: "The Hard Thing About Hard Things"
        by: "Ben Horowitz"
        url: "https://bookshop.org/p/books/the-hard-thing-about-hard-things-building-a-business-when-there-are-no-easy-answers-ben-horowitz/11bac56a0b645615?ean=9780062273208"
        note: "The war stories. 'The Struggle,' and peacetime vs. wartime CEO."
      - title: "The Innovator's Dilemma"
        by: "Clayton Christensen"
        url: "https://www.amazon.com/Innovators-Dilemma-Technologies-Management-Innovation-ebook/dp/B012BLTM6I/"
        note: "How good companies get disrupted by doing everything right."
      - title: "Competing Against Luck"
        by: "Clayton Christensen"
        url: "https://www.amazon.com/Competing-Against-Luck-Innovation-Customer-ebook/dp/B01BBPZIHM/"
        note: "Jobs to be Done. Why your perfect product might not do the right job."
      - title: "Sprint"
        by: "Jake Knapp"
        url: "https://www.amazon.com/Sprint-Solve-Problems-Test-Ideas-ebook/dp/B010MH1DAQ/"
        note: "Test big ideas in five days. Wonderfully practical."
      - title: "The Everything Store"
        by: "Brad Stone"
        url: "https://www.amazon.com/Everything-Store-Jeff-Bezos-Amazon-ebook/dp/B00BWQW73E/"
        note: "Bezos and the age of Amazon."
      - title: "Zero to One"
        by: "Peter Thiel"
        url: "https://www.amazon.com/Zero-One-Future-Paperback-Masters/dp/2511207206/"
        note: "Building something new instead of copying what works."

  - key: articles
    label: BLOGS & ARTICLES
    items:
      - title: "Noahpinion"
        by: "Noah Smith"
        url: "https://www.noahpinion.blog/"
        note: "Economics and tech, clearly and prolifically explained."
      - title: "The Leverage"
        by: ""
        url: ""
        note: "Sharp, concise takes on markets and tech."
      - title: "Stratechery"
        by: "Ben Thompson"
        url: "https://stratechery.com/"
        note: "Business strategy applied to tech, four days a week. Worth the subscription."
      - title: "Good Product Manager, Bad Product Manager"
        by: "Ben Horowitz · a16z"
        url: "https://a16z.com/2012/06/15/good-product-managerbad-product-manager/"
        note: "Old but still the clearest map of what a PM's job actually is."
      - title: "Why Product Management is Hard"
        by: "Saeed Khan"
        url: "https://www.slideshare.net/ProductCampToronto/why-product-management-is-hard-saeed-khan"
        note: "The origins of PM and how the role changes as you scale."
      - title: "How to Write a Painless PRD"
        by: "UXPin"
        url: "https://medium.com/@uxpin/how-to-write-a-painless-product-requirements-document-508ff6807b4a"
        note: "A clean walk-through, useful for non-technical folks."

  - key: podcasts
    label: PODCASTS
    items:
      - title: "Acquired"
        by: "Ben Gilbert & David Rosenthal"
        url: "https://www.acquired.fm/"
        note: "Deep company histories, gloriously long."
      - title: "Invest Like the Best"
        by: "Patrick O'Shaughnessy"
        url: "https://joincolossus.com/"
        note: "Conversations on investing, business, and craft."
      - title: "The Sporkful"
        by: "Dan Pashman"
        url: "https://www.sporkful.com/"
        note: "Food, but really about people."
      - title: "Search Engine"
        by: "PJ Vogt"
        url: "https://www.searchengine.show/"
        note: "One curious question per episode, chased down properly."
