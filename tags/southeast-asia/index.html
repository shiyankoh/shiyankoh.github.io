<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Southeast Asia | The Culdesac</title>
  <meta name="description" content="The Culdesac - A blog by Shiyan Koh">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
  
<style>
  :root{--panel:#150c22;--panel2:#1f142f;--cream:#fdf3dc;--gold:#ffd23f;--pink:#ff4f7d;--cyan:#38e0cf;--green:#8be04f;--violet:#b07bff;--line:#3a2857}
  *{margin:0;padding:0;box-sizing:border-box}
  ::selection{background:var(--pink);color:#fff}
  body{background:var(--panel);color:var(--cream);font-family:'VT323',monospace;font-size:22px;line-height:1.35;image-rendering:pixelated;overflow-x:hidden}
  svg{image-rendering:pixelated;display:block}
  a{color:inherit}
  .log-scene{min-height:100vh;padding:60px 20px 90px;background:linear-gradient(180deg,#241636,#1a0f28);position:relative}
  .log-scene::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 2px,transparent 2px);background-size:28px 28px;pointer-events:none}
  .log-wrap{max-width:900px;margin:0 auto;position:relative;z-index:2}
  .back{display:inline-block;font-family:'Press Start 2P';font-size:9px;color:var(--cream);text-decoration:none;background:rgba(0,0,0,.4);padding:9px 12px;border:2px solid rgba(255,255,255,.25);margin-bottom:28px}
  .back:hover{background:var(--pink);border-color:#fff}
  .log-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px}
  .log-head h1{font-family:'Press Start 2P';font-size:clamp(15px,3vw,24px);color:var(--gold);text-shadow:3px 3px 0 rgba(0,0,0,.5)}
  .log-head .pg{font-family:'Silkscreen';font-size:13px;color:var(--cyan)}
  .quest{display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:center;background:var(--panel2);border:3px solid var(--line);border-left:8px solid var(--gold);padding:18px 20px;margin-bottom:14px;text-decoration:none;transition:.12s}
  .quest:hover{transform:translateX(8px);border-color:#fff;background:#26173a}
  .quest .slot{width:64px;height:64px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center}
  .quest .info .t{font-family:'Press Start 2P';font-size:12px;color:var(--cream);line-height:1.5}
  .quest:hover .info .t{color:var(--gold)}
  .quest .info .d{font-size:20px;color:#c9bda6;margin-top:8px}
  .quest .side{text-align:right;white-space:nowrap}
  .quest .side .xp{display:block;font-family:'Silkscreen';font-size:13px;color:var(--gold)}
  .quest .side .date{display:block;font-size:18px;color:#9a8fb5;margin-top:4px}
  .quest[data-cat="Investing"]{border-left-color:var(--cyan)}
  .quest[data-cat="Parenting"]{border-left-color:var(--pink)}
  .quest[data-cat="Community"]{border-left-color:var(--green)}
  .quest[data-cat="Life"]{border-left-color:var(--gold)}
  @media(max-width:720px){body{font-size:20px}.quest{grid-template-columns:52px 1fr;gap:14px}.quest .side{grid-column:2;text-align:left}}
</style>

</head>
<body>
  
<section class="log-scene">
  <div class="log-wrap">
    <a class="back" href="/">◄ WORLD MAP</a>
    <div class="log-head">
      <h1>▤ SOUTHEAST ASIA</h1>
      <span class="pg">1 QUESTS IN THIS WORLD</span>
    </div>
    
    
    
    <a class="quest" data-cat="Investing" href="/blog/southeast-asia-buyers-not-builders/">
      <div class="slot"><svg width="40" height="40" viewBox="0 0 12 12" shape-rendering="crispEdges"><circle cx="6" cy="6" r="5" fill="#ffd23f"/><rect x="5" y="3" width="2" height="6" fill="#b8891f"/><rect x="4" y="5" width="4" height="2" fill="#b8891f"/></svg>
</div>
      <div class="info">
        <div class="t">Southeast Asia doesn&#39;t have a builder problem. It has a buyer problem.</div>
        <div class="d">I got invited to a lunch a little while ago on &ldquo;redefining Southeast Asia&rsquo;s value proposition.&rdquo; Fourteen people around a table, …</div>
      </div>
      <div class="side">
        <span class="xp">+300 XP</span>
        <span class="date">30 JUL 2026</span>
      </div>
    </a>
    
  </div>
</section>

  <script data-goatcounter="https://shiyankoh.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
