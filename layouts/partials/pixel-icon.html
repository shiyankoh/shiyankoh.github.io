{{- /* category -> pixel item icon (viewBox 12) */ -}}
{{- $c := . -}}
<svg width="40" height="40" viewBox="0 0 12 12" shape-rendering="crispEdges">
{{- if eq $c "Investing" -}}
  <circle cx="6" cy="6" r="5" fill="#ffd23f"/><rect x="5" y="3" width="2" height="6" fill="#b8891f"/><rect x="4" y="5" width="4" height="2" fill="#b8891f"/>
{{- else if eq $c "Parenting" -}}
  <rect x="2" y="6" width="8" height="5" fill="#ff4f7d"/><polygon points="6,2 1,6 11,6" fill="#ff8f4f"/><rect x="5" y="8" width="2" height="3" fill="#45205f"/>
{{- else if eq $c "Community" -}}
  <circle cx="4" cy="4" r="2" fill="#38e0cf"/><circle cx="8" cy="4" r="2" fill="#8be04f"/><rect x="1" y="7" width="6" height="4" fill="#38e0cf"/><rect x="6" y="7" width="5" height="4" fill="#8be04f"/>
{{- else if eq $c "Life" -}}
  <ellipse cx="6" cy="5" rx="4" ry="4" fill="#8be04f"/><rect x="5" y="8" width="2" height="3" fill="#7a4a2c"/><rect x="4" y="4" width="2" height="1" fill="#b6f07a"/>
{{- else -}}
  <rect x="2" y="2" width="8" height="9" fill="#fdf3dc"/><rect x="2" y="2" width="8" height="2" fill="#ff4f7d"/><rect x="4" y="6" width="4" height="1" fill="#45205f"/><rect x="4" y="8" width="4" height="1" fill="#45205f"/>
{{- end -}}
</svg>
